calibration:
  method: isotonic
data:
  path: Data_file/ai4i2020.csv
  random_state: 42
features:
  input:
  - Air temperature [K]
  - Process temperature [K]
  - Rotational speed [rpm]
  - Torque [Nm]
  - Tool wear [min]
  - Product_ID
  target: Machine failure
model:
  class_weight: balanced
  max_depth: null
  n_estimators: 100
  random_state: 42
  type: random_forest
output:
  model_path: models/random_forest.pkl
  save_model: true
preprocessing:
  encode_product_id: true
  stratify: true
split:
  cal_size: 0.25
  test_size: 0.2
threshold:
  search_max: 0.5
  search_min: 0.01
  steps: 100
  target_recall: 0.9
