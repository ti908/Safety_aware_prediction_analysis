data:
  path: Data_file/ai4i2020.csv
  random_state: 42

split:
  test_size: 0.2
  cal_size: 0.25

calibration:
  method: isotonic   # or "sigmoid"

threshold:
  search_min: 0.01
  search_max: 0.5
  steps: 100
  target_recall: 0.90
  #objective: recall      # or "f1"

#Data Features to analyse
features:
  input:
    - Air temperature [K]
    - Process temperature [K]
    - Rotational speed [rpm]
    - Torque [Nm]
    - Tool wear [min]
    - Product_ID
  target: Machine failure

# Model Parameters
model:
  type: random_forest
  n_estimators: 100
  max_depth: null
  class_weight: balanced
  random_state: 42

preprocessing:
  encode_product_id: true
  stratify: true

output:
  save_model: true
  model_path: models/random_forest.pkl